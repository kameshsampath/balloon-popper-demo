# Snowflake lab path: task bronze:*, task check-tools. Local k8s / kubectl flows removed.

version: "3"

includes:
  bronze:
    taskfile: .taskfiles/bronze.yml
  sfquickstarts:
    taskfile: .taskfiles/sfquickstarts.yml

tasks:
  check-tools:
    desc: Verify lab CLIs on PATH (required + recommended direnv/curl/openssl + optional git)
    cmds:
      - uv run check-lab-prereqs

  default:
    desc: List available tasks (start with task check-tools)
    cmds:
      - task --list

  dashboard-local:
    silent: true
    aliases:
      - dashboard
      - streamlit
    desc: run the streamlit dashboard locally
    cmds:
      - uv run --package=dashboard dashboard

  generator-local:
    silent: true
    desc: run the data generator locally (Python; no cluster)
    aliases:
      - generator
    cmds:
      - uv run --package=generator generator
