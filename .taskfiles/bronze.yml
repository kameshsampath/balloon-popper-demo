# Namespace: task bronze:<task>
# Requires real AWS: set AWS_PROFILE (and usually AWS_REGION or configure region on the profile).

version: "3"

tasks:
  extvolume-dry-run:
    desc: Preview S3 + IAM + Snowflake external volume (sfutils-extvolumes; needs snow + AWS_PROFILE)
    cmds:
      - uv run sfutils-extvolumes create --bucket "${BRONZE_EXTVOLUME_BUCKET:-balloon-bronze-warehouse}" --dry-run

  extvolume-create:
    desc: Create S3 bucket + IAM + Snowflake external volume via sfutils-extvolumes (set BRONZE_EXTVOLUME_BUCKET base name; then set BRONZE_WAREHOUSE=s3://<full-bucket>/iceberg/)
    cmds:
      - uv run sfutils-extvolumes create --bucket "${BRONZE_EXTVOLUME_BUCKET:-balloon-bronze-warehouse}"

  render-iam:
    desc: Render lab/aws/bronze-glue-writer-policy.json to .aws-config/ (needs BRONZE_S3_ARN, AWS_PROFILE; optional AWS_ACCOUNT_ID)
    cmds:
      - bash tools/bronze-preload/scripts/render-iam.sh

  glue-setup:
    desc: Create Glue database for Iceberg (needs AWS_PROFILE, BRONZE_WAREHOUSE=s3://bucket/prefix/)
    cmds:
      - bash tools/bronze-preload/scripts/glue-setup.sh

  s3tables-setup:
    desc: Create S3 table bucket + balloon_pops namespace + five ICEBERG tables (needs AWS_PROFILE, BRONZE_S3TABLES_BUCKET_NAME; AWS CLI 2.34+)
    cmds:
      - bash tools/bronze-preload/scripts/s3tables-setup.sh

  load:
    desc: PyIceberg sample rows into Glue Iceberg tables (needs AWS_PROFILE, BRONZE_WAREHOUSE; run after glue-setup)
    cmds:
      - uv run python tools/bronze-preload/load_sample.py

  all:
    desc: glue-setup, s3tables-setup, then load (render-iam is separate — run first if attaching new IAM)
    deps:
      - glue-setup
      - s3tables-setup
      - load
